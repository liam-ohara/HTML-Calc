<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Calculator</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>HTML Calculator</h1>
        <div class="container">
            <div class="cell"><button class="button button-ac">AC</button></div>
            <div class="cell"><button class="button button-divide">÷</button></div>
            <div class="cell"><button class="button button-multiply">x</button></div>
            <div class="cell"><button class="button button-subtract">-</button></div>
            <div class="cell"><button class="button button-numeral">7</button></div>
            <div class="cell"><button class="button button-numeral">8</button></div>
            <div class="cell"><button class="button button-numeral">9</button></div>
            <div class="double-row"><button class="button button-add">+</button></div>
            <div class="cell"><button class="button button-numeral">4</button></div>
            <div class="cell"><button class="button button-numeral">5</button></div>
            <div class="cell"><button class="button button-numeral">6</button></div>
            <div class="cell"><button class="button button-numeral">1</button></div>
            <div class="cell"><button class="button button-numeral">2</button></div>
            <div class="cell"><button class="button button-numeral">3</button></div>
            <div class="double-row"><button class="button button-equals">=</button></div>
            <div class="double-column"><button class="button button-zero">0</button></div>
            <div class="cell"><button class="button button-point">.</button></div>
        </div>
    </body>
</html>
